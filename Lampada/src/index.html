<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acender Lâmpada</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Acender Lâmpada</h1>
    </header>

    <main>
        <div id="botoes">
            <button onclick="ligar()" id="botao1">Ligar</button>
            <button onclick="desligar()" id="botao2">Desligar</button>
        </div>

        <p id="status">Status: aguardando Firebase...</p>
        <p id="firebase-status">Firebase: conectando...</p>
    </main>

    <footer></footer>

    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

        import {
            getDatabase,
            ref,
            set,
            onValue
        } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQGfrAvhELLXdOrmmLLeWH-p7RI8VNou4",
            authDomain: "lampadaesp32.firebaseapp.com",
            databaseURL: "https://lampadaesp32-default-rtdb.firebaseio.com",
            projectId: "lampadaesp32",
            storageBucket: "lampadaesp32.firebasestorage.app",
            messagingSenderId: "240772142944",
            appId: "1:240772142944:web:29aae49d552d0068dd3005"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const lampadaRef = ref(db, "lampada");

        const status = document.getElementById("status");
        const firebaseStatus = document.getElementById("firebase-status");

        async function enviarComando(valor, texto) {
            try {
                status.textContent = "Status: enviando comando...";
                await set(lampadaRef, valor);

                status.textContent = "Status: " + texto;
                firebaseStatus.textContent = "Firebase: comando enviado ✓";
            } catch (erro) {
                console.error("Erro ao enviar comando:", erro);
                status.textContent = "Status: erro ao enviar";
                firebaseStatus.textContent = "Firebase: erro na comunicação";
            }
        }

        window.ligar = function () {
            enviarComando(true, "LIGADA");
        };

        window.desligar = function () {
            enviarComando(false, "DESLIGADA");
        };

        onValue(lampadaRef, (snapshot) => {
            const estado = snapshot.val();

            if (estado === true) {
                status.textContent = "Status: LIGADA";
            } else if (estado === false) {
                status.textContent = "Status: DESLIGADA";
            } else {
                status.textContent = "Status: aguardando comando";
            }

            firebaseStatus.textContent = "Firebase: conectado ✓";
        }, (erro) => {
            console.error("Erro ao ler Firebase:", erro);
            firebaseStatus.textContent = "Firebase: erro na leitura";
        });
    </script>
</body>
</html>
